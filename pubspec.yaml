name: creator_studio
description: "Creator Studio — a production-ready Flutter engine for short-form video creation, inspired by TikTok, Instagram Reels, and CapCut."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

# ===========================================================================
# CREATOR STUDIO — PURE EDITOR (No Social, No Live)
# ---------------------------------------------------------------------------
# This package is a pure video editor. It records, edits, and exports.
# Social media features (feed, stories, profile) and live streaming are
# intentionally excluded — they belong to your main social app.
# ===========================================================================

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ─── State management ───────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1

  # ─── Navigation ─────────────────────────────────────────────────────────
  go_router: ^14.2.7

  # ─── 📷 Camera ──────────────────────────────────────────────────────────
  camerawesome: ^2.1.0+1

  # ─── 📁 Gallery ─────────────────────────────────────────────────────────
  wechat_assets_picker: ^9.3.0
  photo_manager: ^3.0.0

  # ─── ✂️ Video editing ───────────────────────────────────────────────────
  video_editor_2: ^3.1.0
  pro_video_editor: ^1.13.0
  video_player: ^2.9.2

  # ─── 🚀 Export ──────────────────────────────────────────────────────────
  ffmpeg_kit_flutter_new: ^6.0.3
  easy_video_editor: ^0.1.6

  # ─── 🎵 Audio ───────────────────────────────────────────────────────────
  just_audio: ^0.9.40
  record: ^5.1.2
  audio_waveforms: ^1.0.5

  # ─── 🗄️ Drafts ──────────────────────────────────────────────────────────
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24

  # ─── ☁️ Background upload ───────────────────────────────────────────────
  background_downloader: ^9.5.4
  dio: ^5.7.0

  # ─── 🎭 Face detection & background removal ─────────────────────────────
  google_mlkit_face_detection: ^0.12.0
  google_mlkit_selfie_segmentation: ^0.10.0

  # ─── 😀 Stickers / text ─────────────────────────────────────────────────
  emoji_picker_flutter: ^3.1.0
  giphy_get: ^4.0.0
  detectable_text_field: ^3.0.2

  # ─── 🖼️ Image editor ────────────────────────────────────────────────────
  pro_image_editor: ^11.5.2

  # ─── ✨ Animation & polish ──────────────────────────────────────────────
  flutter_animate: ^4.5.0
  lottie: ^3.1.2

  # ─── 🎨 GPU filters ─────────────────────────────────────────────────────
  flutter_image_filters: ^0.7.0

  # ─── 🗂️ Draggable layered canvas ───────────────────────────────────────
  stack_board: ^0.5.0

  # ─── 🤖 Auto Captions (Whisper offline, cross-platform iOS+Android) ─────
  whisper_ggml: ^1.9.2

  # ─── 🔧 Utilities ───────────────────────────────────────────────────────
  path_provider: ^2.1.4
  path: ^1.9.0
  uuid: ^4.5.1
  collection: ^1.18.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  file_picker: ^8.1.3

  # ─── 💾 Save to gallery ─────────────────────────────────────────────────
  gal: ^2.3.0

  # ─── 🗜️ Video compression ──────────────────────────────────────────────
  video_compress: ^3.1.3

  # ─── 🔐 Permissions ─────────────────────────────────────────────────────
  permission_handler: ^11.3.1

  # ─── 📷 Image picker (for gallery import) ───────────────────────────────
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.20.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/fonts/
    - assets/shaders/
    - assets/stickers/

  shaders:
    - assets/shaders/film_grain.frag
    - assets/shaders/vhs_glitch.frag
    - assets/shaders/vignette.frag
    - assets/shaders/chromatic_aberration.frag

  fonts:
    - family: SFProDisplay
      fonts:
        - asset: assets/fonts/SFProDisplay-Regular.ttf
        - asset: assets/fonts/SFProDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/SFProDisplay-Semibold.ttf
          weight: 600
        - asset: assets/fonts/SFProDisplay-Bold.ttf
          weight: 700
